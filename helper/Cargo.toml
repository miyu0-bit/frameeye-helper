[package]
name = "frameeye-helper"
version = "1.0.0"
edition = "2024"
description = "One-click setup for Steam Frame eye tracking in VRChat: installs frameeyeosc on the headset over SSH"
license = "MIT"
publish = false

[[bin]]
name = "FrameEyeHelper"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.36", features = ["glow"] }
egui = "0.36"
russh = { version = "0.63", default-features = false, features = ["ring", "flate2", "rsa"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
if-addrs = "0.15"
directories = "6"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.61", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }

[features]
# `--selftest`: drive the SSH worker against a test headset (tests/fakeframe). Not in release builds.
selftest = []

[build-dependencies]
embed-resource = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
